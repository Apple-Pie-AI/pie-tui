<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Pie Workflows</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header>
    <button class="logo" id="home" title="All workflows">◆ APPLE PIE<small>· WORKFLOWS</small></button>
    <div class="spacer"></div>
    <label class="repo">repo <select id="repo"></select></label>
    <span class="status" id="status"></span>
    <button class="btn" id="discard" title="Throw away unsaved edits">Discard</button>
    <button class="btn primary" id="save">Save changes</button>
  </header>
  <main id="view"><div class="boot">CONNECTING…</div></main>
  <footer><span>◉ agent prompt · ◆ you decide · ▢ Apple Pie does it · 🔒 contract, kept as is whatever you write</span>
    <span class="spacer"></span><span id="file"></span><span><kbd>⌘S</kbd> save</span></footer>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
