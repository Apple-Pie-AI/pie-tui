<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Pie Workflows</title>
<style>
:root{
  --base:#0B0E14; --panel:rgba(17,21,29,.78); --panel2:rgba(23,28,38,.9);
  --ink:#C9D1DC; --strong:#FFFFFF; --dim:#7C8AA0; --faint:#5A6577; --line:rgba(124,138,160,.16);
  --accent:#3DDC84; --accent-soft:rgba(61,220,132,.12); --amber:#E5A24A; --red:#E86B7E; --cyan:#62B8E8;
  --sel:#39404F; --on-accent:#0E1117;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--base);color:var(--ink);font:13px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 340px at 50% -80px,rgba(61,220,132,.16),transparent 70%),
    radial-gradient(600px 400px at 100% 100%,rgba(98,184,232,.07),transparent 70%),
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/36px 36px;
  -webkit-mask-image:linear-gradient(#000 0,rgba(0,0,0,.35) 60%);mask-image:linear-gradient(#000 0,rgba(0,0,0,.35) 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%;overflow-x:hidden}
.panel,.shead,details.lock summary{min-width:0}
button,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(61,220,132,.3)}

/* header */
header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(11,14,20,.6);backdrop-filter:blur(8px)}
.logo{font-weight:700;letter-spacing:.38em;color:var(--accent);text-shadow:0 0 14px rgba(61,220,132,.55);white-space:nowrap}
.logo small{letter-spacing:.3em;color:var(--dim);font-weight:400;text-shadow:none;margin-left:6px}
.spacer{flex:1}
.repo{display:flex;align-items:center;gap:8px;color:var(--faint)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);max-width:260px}
select:focus,textarea:focus,button:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(61,220,132,.35)}
.status{white-space:nowrap;color:var(--dim)}
.status b{font-weight:400}
.status.saved b{color:var(--accent)} .status.dirty b{color:var(--amber)} .status.err b{color:var(--red)}
.btn{border:1px solid var(--faint);background:transparent;color:var(--accent);border-radius:8px;padding:6px 16px;cursor:pointer;letter-spacing:.06em;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 16px rgba(61,220,132,.3)}
.btn.primary:not(:disabled){background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.35;cursor:default}

/* rail */
.rail{display:flex;align-items:flex-start;gap:0;padding:26px 28px 18px;overflow-x:auto;border-bottom:1px solid var(--line)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:104px;cursor:pointer;background:none;border:0;padding:0 4px}
.node .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);background:var(--base);transition:.2s;position:relative}
.node .lbl{letter-spacing:.22em;font-size:11px;color:var(--dim);white-space:nowrap}
.node .sub{font-size:11px;color:var(--faint);white-space:nowrap}
.node.custom .dot{border-color:var(--cyan);box-shadow:0 0 10px rgba(98,184,232,.5)}
.node.custom .sub{color:var(--cyan)}
.node.dirty .sub{color:var(--amber)}
.node.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 18px var(--accent)}
.node.on .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--accent);animation:pulse 1.8s ease-out infinite}
.node.on .lbl{color:var(--strong);text-shadow:0 0 12px rgba(61,220,132,.6)}
.node:hover .lbl{color:var(--ink)}
.node.ghost{cursor:default;opacity:.7}
.node.ghost .dot{transform:rotate(45deg);border-radius:2px;width:12px;height:12px;margin:2px 0;border-style:dashed}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.9);opacity:0}}
.wire{flex:1;min-width:28px;height:2px;margin-top:7px;background:linear-gradient(90deg,var(--faint) 50%,transparent 50%) 0 0/10px 2px;opacity:.55;animation:flow 1.2s linear infinite}
@keyframes flow{to{background-position:10px 0}}
.railsep{align-self:stretch;width:1px;background:var(--line);margin:0 18px 0 22px;position:relative}
.railsep span{position:absolute;top:-20px;left:10px;font-size:10px;letter-spacing:.25em;color:var(--faint);white-space:nowrap}

/* main */
main{display:grid;grid-template-columns:minmax(380px,1fr) minmax(380px,1fr);gap:18px;padding:18px 24px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:0;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 20px 60px -30px rgba(0,0,0,.8)}
.phead{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.ptitle{letter-spacing:.32em;font-weight:700;color:var(--strong)}
.ptitle.acc{color:var(--accent)}
.pblurb{color:var(--dim);margin-top:4px}
.pbody{overflow:auto;padding:14px 18px 22px;flex:1;scrollbar-width:thin;scrollbar-color:var(--sel) transparent}

/* locked block */
details.lock{border:1px dashed rgba(90,101,119,.45);border-radius:8px;margin:0 0 10px;background:rgba(10,13,18,.35)}
details.lock summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:10px;align-items:baseline;color:var(--faint)}
details.lock summary::-webkit-details-marker{display:none}
details.lock summary .tag{font-size:10px;letter-spacing:.2em;color:var(--faint);white-space:nowrap;border:1px solid rgba(90,101,119,.45);border-radius:4px;padding:0 6px}
details.lock summary .tag.contract{color:var(--cyan);border-color:rgba(98,184,232,.35)}
details.lock summary .first{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
details.lock summary .chev{transition:.2s}
details.lock[open] summary .chev{transform:rotate(90deg)}
details.lock pre{margin:0;padding:0 12px 12px;white-space:pre-wrap;word-break:break-word;color:var(--faint);font:inherit;font-size:12px}

/* slot card */
.slot{position:relative;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;background:var(--panel2);transition:border-color .2s,box-shadow .2s}
.slot::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--faint);transition:.2s}
.slot.custom{border-color:rgba(98,184,232,.35)}
.slot.custom::before{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.slot.dirty::before{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.slot:focus-within{border-color:rgba(61,220,132,.55);box-shadow:0 0 24px -6px rgba(61,220,132,.45)}
.slot.flash{animation:flash .9s}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent),0 0 30px rgba(61,220,132,.6)}100%{box-shadow:none}}
.shead{display:flex;align-items:baseline;gap:10px;padding:10px 14px 2px}
.stitle{color:var(--strong);font-weight:700}
.badge{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.slot.custom .badge{color:var(--cyan)} .slot.dirty .badge{color:var(--amber)}
.shelp{color:var(--dim);padding:0 14px 8px;font-size:12px}
textarea{display:block;width:100%;min-height:44px;resize:none;border:0;border-top:1px solid var(--line);background:rgba(7,9,13,.55);color:var(--ink);padding:10px 14px;line-height:1.55;overflow:hidden;font-size:12.5px}
textarea::placeholder{color:var(--faint)}
.sfoot{display:flex;align-items:center;gap:12px;padding:6px 14px 8px;font-size:11px;color:var(--faint);border-top:1px solid var(--line)}
.link{background:none;border:0;color:var(--dim);cursor:pointer;padding:0}
.link:hover:not(:disabled){color:var(--accent)}
.link:disabled{opacity:.35;cursor:default}
.lint{margin:0;padding:6px 14px 10px;list-style:none;color:var(--amber);font-size:12px}
.lint li::before{content:"▲ ";}
.lint:empty{display:none}

/* preview */
.pmeta{display:flex;gap:16px;color:var(--faint);font-size:11px;margin-top:6px;flex-wrap:wrap}
.pmeta i{font-style:normal;color:var(--dim)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--faint);margin-left:auto}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .l1::before{background:var(--faint)} .legend .l2::before{background:var(--dim)} .legend .l3::before{background:var(--cyan)}
pre.prompt{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:12px;color:var(--faint);counter-reset:none}
pre.prompt .s{color:var(--ink);background:rgba(124,138,160,.08);border-radius:3px;cursor:pointer;box-shadow:inset 2px 0 0 var(--dim);padding:0 2px}
pre.prompt .s.custom{color:#E6F4FF;background:rgba(98,184,232,.12);box-shadow:inset 2px 0 0 var(--cyan)}
pre.prompt .s.empty{display:none}
pre.prompt .s:hover{background:rgba(61,220,132,.14)}
pre.prompt .k{color:var(--dim)}

footer{display:flex;gap:16px;align-items:center;padding:8px 24px 12px;color:var(--faint);font-size:11px;border-top:1px solid var(--line)}
footer kbd{border:1px solid var(--faint);border-radius:4px;padding:0 5px;color:var(--dim);font:inherit}
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);padding:8px 18px;border-radius:8px;transition:.25s;box-shadow:0 0 30px rgba(61,220,132,.3);z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red);color:var(--red);box-shadow:0 0 30px rgba(232,107,126,.3)}
.boot{display:grid;place-items:center;height:100%;color:var(--dim);letter-spacing:.3em}
.boot.err{color:var(--red);letter-spacing:normal;text-align:center;padding:24px}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr);padding:14px 16px}
  header{flex-wrap:wrap;padding:12px 16px;gap:10px 14px}
  .logo small{display:none}
  .spacer{display:none}
  footer{flex-wrap:wrap;padding:8px 16px 12px}
  .rail{padding:20px 16px 14px}
  .pbody{max-height:none}
}
</style>
</head>
<body>
<div class="app" id="app"><div class="boot">C O N N E C T I N G …</div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// The token arrives in the URL fragment (never sent to the server) and is kept
// for this tab only, so a reload works and the address bar stays clean.
let token = location.hash.slice(1);
const startStage = new URLSearchParams(location.search).get("stage");
try {
  if (token) sessionStorage.setItem("pie-token", token); else token = sessionStorage.getItem("pie-token") || "";
} catch (e) {}
if (location.hash) history.replaceState(null, "", location.pathname);

const PIPE = ["plan", "implement", "self-review", "verify", "@pr", "comments"];
const MORE = ["rework", "run"];
const S = {repos: [], repo: "", file: "", slots: [], byId: {}, saved: {}, draft: {}, stages: [], lint: {},
  cur: startStage || "plan"};

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const norm = s => String(s || "").replace(/\r\n/g, "\n").replace(/^\n+/, "").replace(/[ \t\n]+$/, "");

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"X-Pie-Token": token, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || (r.status === 401 ? "This editor link has expired - open it again from Apple Pie." : r.statusText));
  return data;
}

// value is a slot's current text in the editor; savedVal what's on disk.
const value = id => (id in S.draft ? S.draft[id] : (S.saved[id] ?? S.byId[id].default));
const savedVal = id => S.saved[id] ?? S.byId[id].default;
const isCustom = id => norm(value(id)) !== norm(S.byId[id].default) && norm(value(id)) !== "";
const isDirty = id => norm(value(id)) !== norm(savedVal(id));
const stageSlots = st => S.slots.filter(s => s.stage === st);
const dirtyCount = () => S.slots.filter(s => isDirty(s.id)).length;

function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast" + (err ? " err" : ""), 2600);
}

async function load(repo) {
  const st = await api("GET", "/api/state?repo=" + encodeURIComponent(repo || ""));
  Object.assign(S, {repos: st.repos, repo: st.repo, file: st.file, slots: st.slots, saved: st.saved || {},
    stages: st.stages, lint: st.lint || {}, draft: {}});
  S.byId = Object.fromEntries(S.slots.map(s => [s.id, s]));
  if (!S.stages.some(s => s.id === S.cur)) S.cur = "plan";
  renderShell();
}

function renderShell() {
  $("#app").innerHTML = `
  <header>
    <div class="logo">◆ APPLE PIE<small>· WORKFLOWS</small></div>
    <div class="spacer"></div>
    <label class="repo">repo <select id="repo">${S.repos.map(r => `<option ${r === S.repo ? "selected" : ""} value="${esc(r)}" title="${esc(r)}">${esc(r.split("/").filter(Boolean).pop() || r)}</option>`).join("")}</select></label>
    <span class="status" id="status"></span>
    <button class="btn" id="discard" title="Throw away unsaved edits">Discard</button>
    <button class="btn primary" id="save">Save changes</button>
  </header>
  <nav class="rail" id="rail"></nav>
  <main>
    <section class="panel"><div class="phead"><div class="ptitle acc" id="stitle"></div><div class="pblurb" id="sblurb"></div></div>
      <div class="pbody" id="editor"></div></section>
    <section class="panel"><div class="phead"><div style="display:flex;align-items:baseline"><div class="ptitle">PREVIEW</div>
      <div class="legend"><span class="l1">locked</span><span class="l2">default</span><span class="l3">yours</span></div></div>
      <div class="pmeta" id="pmeta"></div></div>
      <div class="pbody"><pre class="prompt" id="prompt"></pre></div></section>
  </main>
  <footer><span>🔒 Locked = the contract Apple Pie reads back. It stays intact whatever you write.</span>
    <span class="spacer"></span><span id="file"></span><span><kbd>⌘S</kbd> save</span></footer>`;
  $("#repo").onchange = async e => {
    if (dirtyCount() && !confirm("Discard unsaved changes to this repo's workflow?")) { e.target.value = S.repo; return; }
    await load(e.target.value).catch(err => toast(err.message, true));
  };
  $("#save").onclick = save;
  $("#discard").onclick = () => { S.draft = {}; renderStage(); refresh(); };
  $("#file").textContent = S.file;
  renderStage();
  renderChrome();
}

function renderRail() {
  const node = id => {
    if (id === "@pr") return `<div class="node ghost" title="No prompt: Apple Pie commits, pushes and opens the PR itself"><span class="dot"></span><span class="lbl">PR</span><span class="sub">orchestrator</span></div>`;
    const st = S.stages.find(s => s.id === id);
    const slots = stageSlots(id), n = slots.filter(s => isCustom(s.id)).length, d = slots.some(s => isDirty(s.id));
    const sub = d ? "● unsaved" : n ? `${n} custom` : "default";
    return `<button class="node ${id === S.cur ? "on" : ""} ${n ? "custom" : ""} ${d ? "dirty" : ""}" data-stage="${id}">
      <span class="dot"></span><span class="lbl">${esc(st.title.toUpperCase())}</span><span class="sub">${sub}</span></button>`;
  };
  const rail = $("#rail");
  rail.innerHTML = PIPE.map(node).join('<span class="wire"></span>') +
    `<span class="railsep"><span>ON DEMAND</span></span>` + MORE.map(node).join('<span class="wire" style="visibility:hidden;min-width:8px;flex:0"></span>');
  rail.querySelectorAll("button.node").forEach(b => b.onclick = () => { S.cur = b.dataset.stage; renderStage(); renderChrome(); });
  const on = $(".node.on", rail);
  if (on && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = on.offsetLeft - rail.clientWidth / 2 + on.offsetWidth / 2;
}

function lockTag(text) {
  if (/\.agent\/|\.json/.test(text)) return ["OUTPUT CONTRACT", "contract"];
  if (/TOOL PERMISSIONS|SPENDING LIMIT/.test(text)) return ["PERMISSIONS", "contract"];
  if (/TEAM INSTRUCTIONS/.test(text)) return ["HEADER", ""];
  if (/TICKET |APPROVED PLAN|REVIEW COMMENTS|FAILED STEP|approved plan was/.test(text)) return ["TICKET DATA", ""];
  return ["LOCKED", ""];
}

function renderStage() {
  const st = S.stages.find(s => s.id === S.cur);
  $("#stitle").textContent = st.title.toUpperCase();
  $("#sblurb").textContent = st.blurb;
  const ed = $("#editor");
  ed.innerHTML = st.blocks.map(b => {
    if (!b.slot) {
      const t = b.text.replace(/^\n+|\s+$/g, "");
      if (t.replace(/[\d.\s-]/g, "").length < 3) return "";
      const [tag, cls] = lockTag(t), first = t.split("\n").map(l => l.trim()).find(Boolean);
      return `<details class="lock"><summary><span class="chev">▸</span><span class="tag ${cls}">🔒 ${tag}</span><span class="first">${esc(first)}</span></summary><pre>${esc(t)}</pre></details>`;
    }
    const s = S.byId[b.slot];
    return `<div class="slot" data-slot="${s.id}">
      <div class="shead"><span class="stitle">✎ ${esc(s.title)}</span><span class="badge"></span></div>
      <div class="shelp">${esc(s.help)}</div>
      <textarea spellcheck="false" placeholder="${s.default ? "" : "Nothing yet - write house rules, tools to prefer, things to avoid…"}">${esc(value(s.id))}</textarea>
      <ul class="lint"></ul>
      <div class="sfoot"><button class="link reset">↺ reset to default</button><button class="link undo">⟲ undo unsaved</button><span class="spacer"></span><span class="count"></span></div>
    </div>`;
  }).join("");
  ed.querySelectorAll(".slot").forEach(card => {
    const id = card.dataset.slot, ta = $("textarea", card);
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
    ta.oninput = () => { S.draft[id] = ta.value; fit(); paintSlot(card); renderChrome(); refresh(); };
    $(".reset", card).onclick = () => { ta.value = S.byId[id].default; ta.oninput(); };
    $(".undo", card).onclick = () => { delete S.draft[id]; ta.value = value(id); ta.oninput(); };
    requestAnimationFrame(fit);
    paintSlot(card);
  });
  renderPreview(st);
}

function paintSlot(card) {
  const id = card.dataset.slot, c = isCustom(id), d = isDirty(id), v = value(id);
  card.classList.toggle("custom", c); card.classList.toggle("dirty", d);
  $(".badge", card).textContent = d ? "● unsaved" : c ? "● customized" : (S.byId[id].default ? "default" : "empty");
  $(".count", card).textContent = `${v.length.toLocaleString()} / 8,192`;
  $(".reset", card).disabled = norm(v) === norm(S.byId[id].default);
  $(".undo", card).disabled = !d;
  $(".lint", card).innerHTML = (S.lint[id] || []).map(w => `<li>${esc(w)}</li>`).join("");
}

function renderPreview(st) {
  const text = st.blocks.map(b => b.text).join("");
  $("#prompt").innerHTML = st.blocks.map(b => b.slot
    ? `<span class="s ${isCustom(b.slot) ? "custom" : ""} ${b.text ? "" : "empty"}" data-slot="${b.slot}" title="${esc(S.byId[b.slot].title)} - click to edit">${esc(b.text)}</span>`
    : `<span class="k">${esc(b.text)}</span>`).join("").replace(/<span class="k">/g, '<span>');
  const custom = stageSlots(S.cur).filter(s => isCustom(s.id)).length;
  $("#pmeta").innerHTML = `<span><i>${text.split("\n").length}</i> lines</span><span><i>${text.length.toLocaleString()}</i> chars</span>
    <span>≈ <i>${Math.round(text.length / 4).toLocaleString()}</i> tokens</span><span><i>${custom}</i> customized</span><span>sample ticket PROJ-42</span>`;
  $("#prompt").querySelectorAll(".s").forEach(sp => sp.onclick = () => {
    const card = document.querySelector(`.slot[data-slot="${CSS.escape(sp.dataset.slot)}"]`);
    if (!card) return;
    card.scrollIntoView({behavior: "smooth", block: "center"});
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
    $("textarea", card).focus();
  });
}

function renderChrome() {
  renderRail();
  const n = dirtyCount(), el = $("#status");
  el.className = "status " + (n ? "dirty" : "saved");
  el.innerHTML = n ? `<b>●</b> ${n} unsaved change${n > 1 ? "s" : ""}` : `<b>●</b> saved`;
  $("#save").disabled = !n; $("#discard").disabled = !n;
}

function currentSlots() {
  const out = {};
  for (const s of S.slots) if (isCustom(s.id)) out[s.id] = norm(value(s.id));
  return out;
}

// refresh re-renders the preview from the real prompt builders (debounced).
function refresh() {
  clearTimeout(refresh.t);
  refresh.t = setTimeout(async () => {
    try {
      const r = await api("POST", "/api/preview", {repo: S.repo, slots: currentSlots()});
      S.stages = r.stages; S.lint = r.lint || {};
      renderPreview(S.stages.find(s => s.id === S.cur));
      document.querySelectorAll(".slot").forEach(paintSlot);
    } catch (err) { toast(err.message, true); }
  }, 220);
}

async function save() {
  if (!dirtyCount()) return;
  try {
    const st = await api("PUT", "/api/workflows", {repo: S.repo, slots: currentSlots()});
    Object.assign(S, {saved: st.saved || {}, stages: st.stages, lint: st.lint || {}, draft: {}});
    renderStage(); renderChrome();
    toast("Saved - the next run of " + S.repo.split("/").pop() + " uses this workflow");
  } catch (err) { toast(err.message, true); }
}

addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });
addEventListener("beforeunload", e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ""; } });

load("").catch(err => {
  $("#app").innerHTML = `<div class="boot err">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
